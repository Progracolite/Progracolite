<svg width="1200" height="300" viewBox="0 0 1200 300"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40"
             patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"
            fill="none"
            stroke="#ffffff"
            stroke-opacity="0.035"/>
    </pattern>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="#58a6ff"/>

  <!-- terminal indicator -->
  <circle cx="70" cy="62" r="6"
          fill="#3fb950"
          filter="url(#glow)"/>

  <text x="90" y="68"
        font-family="monospace"
        font-size="18"
        fill="#8b949e">
    SYSTEM ONLINE
  </text>

  <!-- main identity -->
  <text x="70" y="145"
        font-family="monospace"
        font-size="52"
        font-weight="bold"
        fill="#f0f6fc">
    PROGRACOLITE
  </text>

  <text x="73" y="180"
        font-family="monospace"
        font-size="20"
        fill="#58a6ff">
    SOFTWARE / SYSTEMS / AI
  </text>

  <!-- status -->
  <text x="73" y="235"
        font-family="monospace"
        font-size="16"
        fill="#8b949e">
    STATUS ::
  </text>

  <text x="175" y="235"
        font-family="monospace"
        font-size="16"
        fill="#3fb950">
    BUILDING
  </text>

  <!-- decorative terminal -->
  <text x="900" y="110"
        font-family="monospace"
        font-size="14"
        fill="#484f58">
    ./initialize_profile.sh
  </text>

  <text x="900" y="140"
        font-family="monospace"
        font-size="14"
        fill="#484f58">
    loading projects...
  </text>

  <text x="900" y="170"
        font-family="monospace"
        font-size="14"
        fill="#3fb950">
    ✓ systems ready
  </text>

  <text x="900" y="200"
        font-family="monospace"
        font-size="14"
        fill="#3fb950">
    ✓ repositories loaded
  </text>

  <text x="900" y="230"
        font-family="monospace"
        font-size="14"
        fill="#3fb950">
    ✓ profile online
  </text>

</svg>
